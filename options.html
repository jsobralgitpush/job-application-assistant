<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Applicant profile</title></head>
<body>
  <main>
    <h1>Applicant profile</h1>
    <p>Your information stays in this browser and is never committed to GitHub.</p>
    <form id="profile-form">
      <label>Full name<input name="fullName" autocomplete="name" required></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
      <label>Location<input name="location" autocomplete="address-level2"></label>
      <label>LinkedIn<input name="linkedIn" type="url" placeholder="https://linkedin.com/in/..."></label>
      <label>Website / GitHub<input name="website" type="url"></label>
      <label>Current company<input name="currentCompany"></label>
      <label>Current title<input name="currentTitle"></label>
      <label>Years of experience<input name="yearsExperience" inputmode="numeric"></label>
      <label>Salary expectation<input name="salaryExpectation"></label>
      <label>Work authorization<input name="workAuthorization" placeholder="e.g. Authorized to work in Brazil"></label>
      <button type="submit">Save profile</button>
      <output id="status" aria-live="polite"></output>
    </form>
  </main>
  <script type="module" src="/src/options.ts"></script>
</body>
</html>
